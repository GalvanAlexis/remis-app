version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: remis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: remis
      POSTGRES_PASSWORD: remis123
      POSTGRES_DB: remis_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - remis-network

  redis:
    image: redis:7-alpine
    container_name: remis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - remis-network

volumes:
  postgres_data:

networks:
  remis-network:
    driver: bridge
